<style>
:root{--gold:#CDAA7D;--gold-d:#9c7b52;--ivory:#FBF8F2;--cream:#F2EADD;--white:#fff;--esp:#2A1F18;--esp2:#3a2c22;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font:300 1.05rem/1.75 var(--sans);color:var(--esp);background:var(--ivory);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);font-weight:300;line-height:1.05;letter-spacing:-.01em}
h2{font-size:clamp(2.4rem,5vw,4.2rem);margin-bottom:1.5rem}
.it{font-style:italic;color:var(--gold)}
.wrap{width:min(1180px,90%);margin:auto}
.sec{padding:clamp(5rem,12vw,10rem) 0;position:relative}
.ivory{background:var(--ivory)}.cream{background:var(--cream)}.dark{background:var(--esp);color:var(--cream)}
.lead{font:300 clamp(1.4rem,2.4vw,1.9rem)/1.4 var(--serif);margin-bottom:1.2rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,7vw,7rem);align-items:start}
.note{font-size:.85rem;opacity:.65;margin-top:1.5rem;max-width:60ch}

/* nav */
.nav{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.3rem 5vw;color:var(--cream);transition:padding .5s}
.nav:before{content:"";position:absolute;inset:0;background:rgba(42,31,24,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .5s;z-index:-1}
.nav.solid:before{opacity:1}
.nav.solid{padding:.8rem 5vw}
.brand{display:flex;align-items:center;gap:.7rem;font:400 1.7rem var(--serif);letter-spacing:.04em}
.brand img{height:34px}.brand em{color:var(--gold)}
#menu{display:flex;gap:2.2rem;font-size:.9rem}
#menu a{position:relative;padding:.3rem 0}
#menu a:after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
#menu a:hover:after{transform:scaleX(1);transform-origin:left}
.tools{display:flex;align-items:center;gap:1rem}
.lang button{background:none;border:0;padding:.3rem .45rem;font-size:.78rem;cursor:pointer;opacity:.6;letter-spacing:.08em}
.lang button[aria-pressed=true]{opacity:1;color:var(--gold)}
.burger{display:none;background:none;border:0;width:36px;height:36px;position:relative;cursor:pointer}
.burger i{position:absolute;left:6px;right:6px;height:1px;background:currentColor;transition:.4s}
.burger i:first-child{top:13px}.burger i:last-child{top:22px}
.burger[aria-expanded=true] i:first-child{top:18px;transform:rotate(45deg)}
.burger[aria-expanded=true] i:last-child{top:18px;transform:rotate(-45deg)}

/* buttons */
.btn{display:inline-block;position:relative;overflow:hidden;background:var(--gold);color:var(--esp);border:1px solid var(--gold);padding:1rem 2.2rem;font-size:.9rem;letter-spacing:.06em;cursor:pointer;transition:color .5s,transform .3s var(--ease);z-index:0}
.btn:before{content:"";position:absolute;inset:0;background:var(--esp);transform:translateY(101%);transition:transform .5s var(--ease);z-index:-1}
.btn:after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4.5s 2s infinite}
@keyframes shine{0%,60%{left:-80%}100%{left:140%}}
.btn:hover{color:var(--gold)}.btn:hover:before{transform:none}
.btn.sm{padding:.6rem 1.3rem;font-size:.8rem}
.btn.ghost{background:transparent;color:inherit;border-color:rgba(205,170,125,.6)}
.btn.ghost:before{background:var(--gold)}.btn.ghost:hover{color:var(--esp)}.btn.ghost:after{display:none}
.dark .btn:before,.hero .btn:before,.nav .btn:before{background:var(--ivory)}
.cta{display:flex;gap:1rem;flex-wrap:wrap;margin-top:2rem}

/* hero */
.hero{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;color:var(--cream);background:radial-gradient(ellipse at 70% 20%,#5a4430 0,transparent 55%),radial-gradient(ellipse at 15% 90%,#4a3626 0,transparent 50%),var(--esp);overflow:hidden}
.phero{min-height:92svh}
.hero-bg{position:absolute;inset:-6% 0;opacity:.4}
.hero-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,31,24,.5),rgba(42,31,24,.2) 40%,var(--esp));pointer-events:none}
.orbs{position:absolute;inset:0;z-index:1;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(205,170,125,.5),transparent 70%);animation:float 9s ease-in-out infinite}
.orbs i:nth-child(1){width:260px;height:260px;left:6%;top:18%}
.orbs i:nth-child(2){width:180px;height:180px;right:9%;top:30%;animation-delay:-3s;animation-duration:11s}
.orbs i:nth-child(3){width:120px;height:120px;left:42%;bottom:12%;animation-delay:-6s;animation-duration:8s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-34px) scale(1.15)}}
.hero-in{position:relative;z-index:2;padding:8rem 5vw 6rem;max-width:1000px}
.kicker{font-size:.85rem;letter-spacing:.2em;color:var(--gold);margin-bottom:2rem;opacity:0;animation:up 1.2s .2s var(--ease) forwards}
.hero h1{font-size:clamp(3.2rem,9.5vw,8rem);font-weight:300;opacity:0;animation:up 1.4s .4s var(--ease) forwards}
.hero h1 .it{background:linear-gradient(100deg,var(--gold) 30%,#f4e3c6 50%,var(--gold) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gleam 5s 2s linear infinite}
@keyframes gleam{to{background-position:-250% 0}}
.smile{width:min(640px,86%);margin:1.2rem auto 0;display:block;overflow:visible}
.smile .tooth{fill:rgba(251,248,242,.92);stroke:var(--gold);stroke-width:1;transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:align 1.8s var(--ease) forwards;animation-delay:calc(.9s + var(--i)*.12s)}
@keyframes align{from{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}30%{opacity:1}to{opacity:1;transform:none}}
.smile .wire{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;stroke-linecap:round;animation:draw 2.2s 2.4s var(--ease) forwards}
.smile .brk{fill:var(--gold);transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .6s var(--ease) forwards;animation-delay:calc(2.4s + var(--i)*.12s)}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.sub{max-width:52ch;margin:1.8rem auto 0;opacity:0;animation:up 1.2s 2.2s var(--ease) forwards;color:rgba(242,234,221,.8)}
.chips{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:2.2rem;opacity:0;animation:up 1.2s 2.5s var(--ease) forwards}
.chips a{border:1px solid rgba(205,170,125,.5);padding:.55rem 1.3rem;font-size:.85rem;transition:background .4s,color .4s,transform .4s var(--ease)}
.chips a:hover,.chips a.on{background:var(--gold);color:var(--esp);transform:translateY(-3px)}
.kicker a{border-bottom:1px solid transparent;transition:border-color .3s}.kicker a:hover{border-color:var(--gold)}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.scroll{position:absolute;bottom:2rem;left:50%;z-index:2;width:1px;height:60px;background:rgba(205,170,125,.3);overflow:hidden}
.scroll span{display:block;width:1px;height:20px;background:var(--gold);animation:drip 2s infinite}
@keyframes drip{from{transform:translateY(-20px)}to{transform:translateY(60px)}}
#bar{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;z-index:60}

/* marquee */
.marq{background:var(--gold);color:var(--esp);overflow:hidden;white-space:nowrap;padding:.9rem 0;font:italic 400 1.5rem var(--serif)}
.marq div{display:inline-flex;gap:3rem;animation:slide 28s linear infinite;padding-left:3rem}
.marq span:after{content:"✦";margin-left:3rem;font-style:normal;font-size:.9rem}
@keyframes slide{to{transform:translateX(-50%)}}

/* intro */
.intro{text-align:center;max-width:780px}

/* image frames */
.ph{position:relative;overflow:hidden;background:linear-gradient(145deg,#e8dcc8,#d6c3a3 55%,#c9b08a);display:grid;place-items:center;margin:0;aspect-ratio:4/5;transition:transform .5s var(--ease),box-shadow .5s;will-change:transform}
.ph:before{content:"";position:absolute;inset:14px;border:1px solid rgba(255,255,255,.55);z-index:1;pointer-events:none;transition:inset .6s var(--ease)}
.ph:hover:before{inset:22px}
.ph:hover{box-shadow:0 30px 60px -25px rgba(42,31,24,.5)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.12)}
.ph b{font:italic 300 1.4rem var(--serif);color:rgba(42,31,24,.45);z-index:0}
.ph.reveal{clip-path:inset(0 0 100% 0);transition:clip-path 1.4s var(--ease),opacity 1.2s,transform .5s var(--ease),box-shadow .5s;opacity:1;transform:none}
.ph.reveal.in{clip-path:inset(0)}
.svc .split{align-items:center}
.flip .ph{order:2}
.svc h2{font-size:clamp(2.2rem,4.5vw,3.6rem)}
.svc h3{font-size:1.7rem;color:var(--gold-d);margin:1.8rem 0 .8rem}
.num{position:absolute;right:4vw;top:2rem;font:italic 300 clamp(8rem,20vw,16rem)/1 var(--serif);color:var(--gold);opacity:.14;pointer-events:none;animation:float 12s ease-in-out infinite}
.steps{list-style:none;position:relative;padding-left:1.9rem}
.steps:before{content:"";position:absolute;left:5px;top:1rem;bottom:1rem;width:1px;background:var(--gold);transform:scaleY(0);transform-origin:top;transition:transform 2s var(--ease)}
.steps.in:before{transform:none}
.steps li{position:relative;padding:.5rem 0;opacity:0;transform:translateX(-14px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.steps.in li{opacity:1;transform:none}
.steps li:before{content:"";position:absolute;left:-1.9rem;top:1.15rem;width:11px;height:11px;border-radius:50%;background:var(--ivory);border:1px solid var(--gold)}
.steps.in li:before{animation:ping 2.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(205,170,125,.6)}70%,100%{box-shadow:0 0 0 12px rgba(205,170,125,0)}}
.cream .steps li:before{background:var(--cream)}
.know{margin:1.6rem 0 2rem;padding:1rem 1.3rem;border-left:2px solid var(--gold);background:rgba(205,170,125,.12);font-size:.95rem}
.know strong{font-weight:500;color:var(--gold-d)}

/* journey */
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;margin-top:4rem;position:relative}
.journey:before{content:"";position:absolute;left:0;right:0;top:22px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform 2.4s var(--ease)}
.journey.in:before{transform:none}
.jn{position:relative;padding-top:4rem;opacity:0;transform:translateY(30px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.journey.in .jn{opacity:1;transform:none}
.jn:before{content:attr(data-n);position:absolute;top:0;left:0;width:46px;height:46px;border-radius:50%;background:var(--esp);border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:400 1.3rem var(--serif);transition:background .4s,color .4s,transform .5s var(--ease)}
.jn:hover:before{background:var(--gold);color:var(--esp);transform:scale(1.15) rotate(-8deg)}
.jn h3{font-size:1.7rem;color:var(--gold);margin-bottom:.5rem}
.jn p{opacity:.8;font-size:.97rem}

/* compare */
.tw{overflow-x:auto;margin-top:3rem;border:1px solid rgba(42,31,24,.15)}
table{width:100%;border-collapse:collapse;min-width:680px;background:var(--white)}
th,td{text-align:left;padding:1.2rem 1.4rem;border-bottom:1px solid rgba(42,31,24,.1);vertical-align:top;font-size:.97rem}
thead th{font:400 1.6rem var(--serif);color:var(--gold-d);background:var(--cream)}
tbody th{font-weight:500;font-size:.8rem;letter-spacing:.08em;color:var(--gold-d)}
tbody tr{transition:background .4s}
tbody tr:hover{background:rgba(205,170,125,.14)}
tbody td{transition:padding .4s var(--ease)}
tbody tr:hover td{padding-left:1.8rem}

/* after */
.after ul{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(205,170,125,.25);border:1px solid rgba(205,170,125,.25);margin-top:2rem}
.after li{background:var(--esp);padding:2.2rem 2rem;font:300 1.35rem/1.35 var(--serif);transition:background .5s,color .5s,transform .5s var(--ease)}
.after li:hover{background:var(--esp2);color:var(--gold);transform:translateY(-6px)}

/* faq */
.faq{max-width:860px}
details{border-bottom:1px solid rgba(42,31,24,.18);padding:1.3rem 0}
summary{cursor:pointer;font:400 1.6rem/1.2 var(--serif);list-style:none;display:flex;justify-content:space-between;gap:1rem;transition:color .3s}
summary::-webkit-details-marker{display:none}
summary:hover{color:var(--gold-d)}
summary:after{content:"+";color:var(--gold);transition:transform .4s var(--ease)}
details[open] summary:after{transform:rotate(45deg)}
details p{padding-top:.8rem;opacity:.8;max-width:65ch;animation:fade .6s}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}}

.cta-band{text-align:center;overflow:hidden}.cta-band p{opacity:.8;max-width:50ch;margin:0 auto}.cta-band .cta{justify-content:center}
.cta-band:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;left:50%;top:50%;margin:-260px 0 0 -260px;background:radial-gradient(circle,rgba(205,170,125,.25),transparent 65%);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.35);opacity:.6}}
.cta-band .wrap{position:relative}
.addr{margin-top:1rem!important;font-size:.9rem}
.foot{background:#1d1510;color:rgba(242,234,221,.7);text-align:center;padding:4rem 5vw;display:grid;gap:1rem;font-size:.9rem}
.foot .brand{justify-content:center;color:var(--cream)}
.foot a{color:var(--gold);margin-left:1rem}

/* reveal */
.js .rv{opacity:0;transform:translateY(40px);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease)}
.js .rv.in{opacity:1;transform:none}
.js .rv.l{transform:translateX(-50px)}.js .rv.r{transform:translateX(50px)}
.js .rv.l.in,.js .rv.r.in{transform:none}

@media(max-width:980px){
 .split,.journey{grid-template-columns:1fr}.journey:before{display:none}
 .burger{display:block}.nav .btn.sm{display:none}
 #menu{position:fixed;inset:0;background:var(--esp);flex-direction:column;justify-content:center;align-items:center;gap:1.6rem;font:300 2.4rem var(--serif);transform:translateY(-100%);transition:transform .7s var(--ease),visibility 0s .7s;z-index:-1;visibility:hidden}
 #menu.open{transform:none;visibility:visible;transition-delay:0s}
 .flip .ph{order:0}
}
@media(max-width:700px){.after ul{grid-template-columns:1fr}.brand{font-size:1.4rem}.tools{gap:.3rem}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
 .kicker,.hero h1,.sub,.chips{opacity:1}.smile .wire{stroke-dashoffset:0}.smile .tooth,.smile .brk{opacity:1}.steps li,.jn{opacity:1;transform:none}.steps:before,.journey:before{transform:none}.ph.reveal{clip-path:none}}
</style>
</head>
<body>
<div id="bar" aria-hidden="true"></div>
<header class="nav" id="nav">
  <a class="brand" href="#top" aria-label="Dea Dent"><img src="images/logo.png" alt="" onerror="this.remove()"><span>Dea <em>Dent</em></span></a>

<main id="main">
<section class="hero phero" id="top">

        <rect class="tooth" style="--i:6;--x:36px;--y:26px;--r:22deg" x="495" y="38" width="46" height="62" rx="20"/>
      </g>
      <path class="wire" pathLength="1" d="M42 58 H560"/>
      <circle class="brk" style="--i:0" cx="55" cy="58" r="6"/><circle class="brk" style="--i:1" cx="131" cy="58" r="6"/><circle class="brk" style="--i:2" cx="210" cy="58" r="6"/><circle class="brk" style="--i:3" cx="290" cy="58" r="6"/><circle class="brk" style="--i:4" cx="369" cy="58" r="6"/><circle class="brk" style="--i:5" cx="445" cy="58" r="6"/><circle class="brk" style="--i:6" cx="518" cy="58" r="6"/>

<div class="marq" aria-hidden="true"><div><span data-i="i21"></span><span data-i="i22"></span><span data-i="i23"></span><span data-i="i21"></span><span data-i="i22"></span><span data-i="i23"></span><span data-i="i21"></span><span data-i="i22"></span><span data-i="i23"></span><span data-i="i21"></span><span data-i="i22"></span><span data-i="i23"></span></div></div>

<section class="sec ivory"><div class="wrap intro rv"><h2 data-i="in_t"></h2><p class="lead" data-i="in_p"></p></div></section>

<section class="sec cream svc" id="fixed"><span class="num" aria-hidden="true">01</span><div class="wrap split">
  <figure class="ph nl reveal"><img referrerpolicy="no-referrer" src="https://i.imgur.com/6PHapFc.jpeg" alt="" loading="lazy" onerror="this.remove()"><b data-i="i21"></b></figure><!-- REPLACE: images/treatment2-fixed.jpg -->
  <div><h2 class="rv r" data-i="i21"></h2><p class="lead rv" data-i="f_p"></p>
    <h3 class="rv" data-i="lbl_steps"></h3>

};
addEventListener('scroll',onScroll,{passive:true});onScroll();
const toggle=o=>{menu.classList.toggle('open',o);burger.setAttribute('aria-expanded',o);document.body.style.overflow=o?'hidden':''};
burger.addEventListener('click',()=>toggle(!menu.classList.contains('open')));
$$('#menu a').forEach(a=>a.addEventListener('click',()=>toggle(false)));

const io=window.IntersectionObserver?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15}):{observe:el=>el.classList.add('in'),unobserve(){}};
$$('.rv,.reveal,.journey').forEach((el,i)=>{if(el.classList.contains('rv'))el.style.transitionDelay=(i%3)*90+'ms';io.observe(el)});
/* failsafe: never leave content hidden */
setTimeout(()=>$$('.rv:not(.in),.reveal:not(.in),.journey:not(.in)').forEach(el=>{const r=el.getBoundingClientRect();if(r.top<innerHeight*1.1)el.classList.add('in')}),1500);
$$('.steps li').forEach((li,i)=>{li.style.transitionDelay=(i%4)*140+'ms'});
$$('.steps').forEach(s=>io.observe(s));

const chips=$$('.chips a'),so=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting)chips.forEach(c=>c.classList.toggle('on',c.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-40% 0px -50% 0px'});
$$('.svc').forEach(s=>so.observe(s));

/* 3D tilt on images + magnetic buttons (mouse devices only) */
if(matchMedia('(hover:hover) and (prefers-reduced-motion:no-preference)').matches){
  $$('.svc .ph').forEach(f=>{
    f.addEventListener('mousemove',e=>{const r=f.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      f.style.transform=`perspective(900px) rotateY(${x*8}deg) rotateX(${-y*8}deg) scale(1.02)`});
    f.addEventListener('mouseleave',()=>{f.style.transform=''});
  });
  $$('.btn').forEach(b=>{
    b.addEventListener('mousemove',e=>{const r=b.getBoundingClientRect();
      b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.15}px,${(e.clientY-r.top-r.height/2)*.25}px)`});
    b.addEventListener('mouseleave',()=>{b.style.transform=''});
  });
}
$('#yr').textContent=new Date().getFullYear();
</script>
</body>
</html>
