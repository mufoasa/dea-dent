<style>
:root{--gold:#CDAA7D;--gold-d:#9c7b52;--ivory:#FBF8F2;--cream:#F2EADD;--white:#fff;--esp:#2A1F18;--esp2:#3a2c22;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font:300 1.05rem/1.75 var(--sans);color:var(--esp);background:var(--ivory);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.skip{position:absolute;left:-999px;background:var(--gold);color:var(--esp);padding:.6rem 1rem;z-index:99}
.skip:focus{left:1rem;top:1rem}
h1,h2,h3{font-family:var(--serif);font-weight:300;line-height:1.05;letter-spacing:-.01em}
h2{font-size:clamp(2.4rem,5vw,4.2rem);margin-bottom:1.5rem}
.it{font-style:italic;color:var(--gold)}
.wrap{width:min(1180px,90%);margin:auto}
.sec{padding:clamp(5rem,12vw,10rem) 0}
.ivory{background:var(--ivory)}.cream{background:var(--cream)}.dark{background:var(--esp);color:var(--cream)}
.lead{font:300 clamp(1.4rem,2.4vw,1.9rem)/1.4 var(--serif);margin-bottom:1.2rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,7vw,7rem);align-items:start}
.note{font-size:.85rem;opacity:.65;margin-top:1.5rem;max-width:60ch}
.warn{margin-top:1.5rem;padding:1rem 1.2rem;border-left:2px solid var(--gold);font-size:.88rem;color:var(--gold)}


.nav{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.3rem 5vw;color:var(--cream);transition:background .5s,padding .5s,color .5s}
.nav:before{content:"";position:absolute;inset:0;background:rgba(42,31,24,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .5s;z-index:-1}
.nav.solid:before{opacity:1}
.nav.solid{padding:.8rem 5vw}
.brand{display:flex;align-items:center;gap:.7rem;font:400 1.7rem var(--serif);letter-spacing:.04em}
.brand img{height:34px}.brand em{color:var(--gold)}
#menu{display:flex;gap:2.2rem;font-size:.9rem}
#menu a{position:relative;padding:.3rem 0}
#menu a:after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
#menu a:hover:after{transform:scaleX(1);transform-origin:left}
.tools{display:flex;align-items:center;gap:1rem}
.lang button{background:none;border:0;padding:.3rem .45rem;font-size:.78rem;cursor:pointer;opacity:.6;letter-spacing:.08em}
.lang button[aria-pressed=true]{opacity:1;color:var(--gold)}
.burger{display:none;background:none;border:0;width:36px;height:36px;position:relative;cursor:pointer}
.burger i{position:absolute;left:6px;right:6px;height:1px;background:currentColor;transition:.4s}
.burger i:first-child{top:13px}.burger i:last-child{top:22px}
.burger[aria-expanded=true] i:first-child{top:18px;transform:rotate(45deg)}
.burger[aria-expanded=true] i:last-child{top:18px;transform:rotate(-45deg)}


.btn{display:inline-block;position:relative;overflow:hidden;background:var(--gold);color:var(--esp);border:1px solid var(--gold);padding:1rem 2.2rem;font-size:.9rem;letter-spacing:.06em;cursor:pointer;transition:color .5s,transform .4s var(--ease);z-index:0}
.btn:before{content:"";position:absolute;inset:0;background:var(--esp);transform:translateY(101%);transition:transform .5s var(--ease);z-index:-1}
.btn:hover{color:var(--gold)}.btn:hover:before{transform:none}
.btn.sm{padding:.6rem 1.3rem;font-size:.8rem}
.btn.ghost{background:transparent;color:inherit;border-color:rgba(205,170,125,.6)}
.btn.ghost:before{background:var(--gold)}.btn.ghost:hover{color:var(--esp)}
.dark .btn:before,.hero .btn:before,.nav .btn:before{background:var(--ivory)}
.btn.dk{color:var(--esp)}.btn.dk:hover{color:var(--gold)}
.btn.ghost.dk:hover{color:var(--esp)}
.cta{display:flex;gap:1rem;flex-wrap:wrap;margin-top:2rem}


.hero{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;color:var(--cream);background:radial-gradient(ellipse at 70% 20%,#5a4430 0,transparent 55%),radial-gradient(ellipse at 15% 90%,#4a3626 0,transparent 50%),var(--esp);overflow:hidden}
.hero-bg{position:absolute;inset:-6% 0;opacity:.45}
.hero-bg img,.hero-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-bg:has(video.on){opacity:.7}
.vbtn{position:absolute;right:5vw;bottom:2rem;z-index:3;width:42px;height:42px;border-radius:50%;background:rgba(42,31,24,.5);border:1px solid var(--gold);color:var(--gold);font-size:.7rem;cursor:pointer;transition:background .4s,color .4s}
.vbtn:hover{background:var(--gold);color:var(--esp)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,31,24,.5),rgba(42,31,24,.2) 40%,var(--esp));pointer-events:none}
.hero-in{position:relative;z-index:2;padding:8rem 5vw 6rem;max-width:1000px}
.kicker{font-size:.85rem;letter-spacing:.2em;color:var(--gold);margin-bottom:2rem;opacity:0;animation:up 1.2s .2s var(--ease) forwards}
.hero h1{font-size:clamp(3.2rem,9.5vw,8rem);font-weight:300;opacity:0;animation:up 1.4s .4s var(--ease) forwards}
.arc{width:min(520px,70%);margin:.4rem auto 0;display:block;overflow:visible}
.arc path{fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s 1.1s var(--ease) forwards}
.sub{max-width:52ch;margin:1.8rem auto 0;opacity:0;animation:up 1.2s 1.8s var(--ease) forwards;color:rgba(242,234,221,.8)}
.hero .cta{justify-content:center;opacity:0;animation:up 1.2s 2.1s var(--ease) forwards}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
.scroll{position:absolute;bottom:2rem;left:50%;z-index:2;width:1px;height:60px;background:rgba(205,170,125,.3);overflow:hidden}
.scroll span{display:block;width:1px;height:20px;background:var(--gold);animation:drip 2s infinite}
@keyframes drip{from{transform:translateY(-20px)}to{transform:translateY(60px)}}


.ph{position:relative;overflow:hidden;background:linear-gradient(145deg,#e8dcc8,#d6c3a3 55%,#c9b08a);display:grid;place-items:center;cursor:zoom-in;margin:0}
.ph:before{content:"";position:absolute;inset:14px;border:1px solid rgba(255,255,255,.55);z-index:1;pointer-events:none;transition:inset .6s var(--ease)}
.ph:hover:before{inset:22px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform 1.4s var(--ease)}
.ph:hover img{transform:scale(1.06)}
.ph b{font:italic 300 1.4rem var(--serif);color:rgba(42,31,24,.45);z-index:0}
.portrait{aspect-ratio:4/5}
.doc{display:grid;grid-template-columns:5fr 6fr;gap:clamp(2rem,7vw,6rem);align-items:center}
.role{font:italic 1.5rem var(--serif);color:var(--gold-d);margin-bottom:1rem}
.link{display:inline-block;margin-top:1.5rem;border-bottom:1px solid var(--gold);padding-bottom:.2rem;transition:color .3s}
.link:hover{color:var(--gold-d)}


.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(205,170,125,.25);border:1px solid rgba(205,170,125,.25);margin-top:3rem}
.tc{background:var(--esp);padding:2.5rem 2rem;display:flex;flex-direction:column;gap:1rem;min-height:380px;transition:background .6s}
.tc:hover{background:var(--esp2)}
.tc h3{font-size:2rem;color:var(--gold)}
.tc ul{list-style:none;flex:1}
.tc li{padding:.7rem 0;border-bottom:1px solid rgba(205,170,125,.18);opacity:.85;font-size:.98rem;transition:padding .5s var(--ease),color .4s}
.tc li:hover{padding-left:.6rem;color:var(--gold)}
.tc a{font-size:.85rem;margin-right:1.2rem;border-bottom:1px solid transparent;align-self:flex-start;transition:.4s}
.tc:hover a{border-color:var(--gold);color:var(--gold)}


.show{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:clamp(150px,20vw,260px);gap:1rem;margin-top:3rem}
.show .ph:nth-child(1){grid-column:span 4;grid-row:span 2}
.show .ph:nth-child(2){grid-column:span 2}.show .ph:nth-child(3){grid-column:span 2}
.show .ph:nth-child(4){grid-column:span 6}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:3rem}
.grid .ph{aspect-ratio:4/5}.grid .ph:nth-child(3n+2){aspect-ratio:1;align-self:end}
.grid.cert{grid-template-columns:repeat(4,1fr)}.grid.cert .ph{aspect-ratio:3/4!important;align-self:auto!important}


form{display:grid;gap:1.4rem}
label span{display:block;font-size:.8rem;letter-spacing:.08em;color:var(--gold);margin-bottom:.2rem}
input,select,textarea{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(205,170,125,.4);padding:.6rem 0;border-radius:0;transition:border-color .4s}
select option{color:var(--esp)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold)}
input:invalid:not(:placeholder-shown){border-color:#c77}
#status{min-height:1.5rem;color:var(--gold);font-size:.9rem}


.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(2rem,6vw,6rem);align-items:stretch}
dt{font-size:.8rem;letter-spacing:.08em;color:var(--gold-d);margin-top:1.5rem}
dd{font:400 1.5rem/1.3 var(--serif)}
dd a:hover{color:var(--gold-d)}
.map{min-height:420px;filter:sepia(.35) saturate(.8);border:1px solid var(--gold);padding:10px}
.map iframe{width:100%;height:100%;min-height:400px;border:0}
.foot{background:#1d1510;color:rgba(242,234,221,.7);text-align:center;padding:4rem 5vw;display:grid;gap:1rem;font-size:.9rem}
.foot .brand{justify-content:center;color:var(--cream)}
.foot a{color:var(--gold);margin-left:1rem}


.lb{position:fixed;inset:0;z-index:100;background:rgba(20,14,10,.96);display:grid;place-items:center;color:var(--cream)}
.lb[hidden]{display:none}
.stage{width:min(88vw,900px);height:76vh;display:grid;place-items:center}
.stage img{max-width:100%;max-height:100%;object-fit:contain;animation:fade .5s}
.stage div{width:min(70vw,520px);aspect-ratio:4/5;display:grid;place-items:center;background:linear-gradient(145deg,#e8dcc8,#c9b08a);color:rgba(42,31,24,.5);font:italic 1.6rem var(--serif)}
@keyframes fade{from{opacity:0;transform:scale(.98)}}
#cap{position:absolute;bottom:1.5rem;font:italic 1.2rem var(--serif);color:var(--gold)}
.lb button{position:absolute;background:none;border:0;color:var(--cream);font-size:3rem;cursor:pointer;padding:1rem;line-height:1}
.lb button:hover{color:var(--gold)}
.x{top:1rem;right:1.5rem}.pv{left:1rem}.nx{right:1rem}


.js .rv{opacity:0;transform:translateY(40px);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease)}
.js .rv.in{opacity:1;transform:none}

@media(max-width:980px){
 .tgrid{grid-template-columns:1fr 1fr}.grid.cert{grid-template-columns:1fr 1fr}
 .split,.doc,.contact{grid-template-columns:1fr}
 .burger{display:block}.nav .btn.sm{display:none}
 #menu{position:fixed;inset:0;background:var(--esp);flex-direction:column;justify-content:center;align-items:center;gap:1.6rem;font:300 2.4rem var(--serif);transform:translateY(-100%);transition:transform .7s var(--ease),visibility 0s .7s;z-index:-1;visibility:hidden}
 #menu.open{transform:none;visibility:visible;transition-delay:0s}
}
@media(max-width:640px){
 body{font-size:1rem}
 .tgrid,.grid{grid-template-columns:1fr}.grid .ph,.grid .ph:nth-child(3n+2){aspect-ratio:4/5;align-self:auto}
 .show{grid-template-columns:1fr 1fr}.show .ph:nth-child(n){grid-column:span 2;grid-row:auto}
 .grid.cert{grid-template-columns:1fr 1fr}
 .brand{font-size:1.4rem}.tools{gap:.3rem}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.arc path{stroke-dashoffset:0}.kicker,.hero h1,.sub,.hero .cta{opacity:1}}


#bar{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;z-index:60}
.phero{min-height:84svh}
.kicker a{border-bottom:1px solid transparent;transition:border-color .3s}.kicker a:hover{border-color:var(--gold)}
.chips{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:2.2rem;opacity:0;animation:up 1.2s 2.1s var(--ease) forwards}
.chips a{border:1px solid rgba(205,170,125,.5);padding:.55rem 1.3rem;font-size:.85rem;transition:background .4s,color .4s}
.chips a:hover,.chips a.on{background:var(--gold);color:var(--esp)}
.intro{text-align:center;max-width:780px}
.svc .split{align-items:center}
.svc .ph{aspect-ratio:4/5;cursor:default}
.svc .ph img{transform:scale(1.12)}
.svc .ph:hover img{transform:none}
.flip .ph{order:2}
.svc h2{font-size:clamp(2.2rem,4.5vw,3.6rem)}
.svc h3{font-size:1.7rem;color:var(--gold-d);margin:1.8rem 0 .8rem}
.steps{list-style:none;position:relative;padding-left:1.9rem}
.steps:before{content:"";position:absolute;left:5px;top:1rem;bottom:1rem;width:1px;background:var(--gold);transform:scaleY(0);transform-origin:top;transition:transform 2s var(--ease)}
.steps.in:before{transform:none}
.steps li{position:relative;padding:.5rem 0;opacity:0;transform:translateX(-14px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.steps.in li{opacity:1;transform:none}
.steps li:before{content:"";position:absolute;left:-1.9rem;top:1.15rem;width:11px;height:11px;border-radius:50%;background:var(--ivory);border:1px solid var(--gold)}
.cream .steps li:before{background:var(--cream)}
.know{margin:1.6rem 0 2rem;padding:1rem 1.3rem;border-left:2px solid var(--gold);background:rgba(205,170,125,.12);font-size:.95rem}
.know strong{font-weight:500;color:var(--gold-d)}
.after ul{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(205,170,125,.25);border:1px solid rgba(205,170,125,.25);margin-top:2rem}
.after li{background:var(--esp);padding:2.2rem 2rem;font:300 1.35rem/1.35 var(--serif);transition:background .5s,color .5s}
.after li:hover{background:var(--esp2);color:var(--gold)}
.faq{max-width:860px}
details{border-bottom:1px solid rgba(42,31,24,.18);padding:1.3rem 0}
summary{cursor:pointer;font:400 1.6rem/1.2 var(--serif);list-style:none;display:flex;justify-content:space-between;gap:1rem;transition:color .3s}
summary::-webkit-details-marker{display:none}
summary:hover{color:var(--gold-d)}
summary:after{content:"+";color:var(--gold);transition:transform .4s var(--ease)}
details[open] summary:after{transform:rotate(45deg)}
details p{padding-top:.8rem;opacity:.8;max-width:65ch;animation:fade .6s}
.cta-band{text-align:center}.cta-band p{opacity:.8;max-width:50ch;margin:0 auto}.cta-band .cta{justify-content:center}
.card-more{margin-top:.2rem}
@media(max-width:700px){.after ul{grid-template-columns:1fr}.flip .ph{order:0}}
@media(prefers-reduced-motion:reduce){.chips{opacity:1}.steps li{opacity:1;transform:none}.steps:before{transform:none}}

</style>
</head>
